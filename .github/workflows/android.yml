name: Android validation

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

concurrency:
  # Push and PR checks for the same head branch share one group.
  group: noma-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run JVM tests, lint, and compile
        run: gradle --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleDebug
      - name: Upload JVM and lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Noma-build-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Noma-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM for Android emulator
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      # The Google APIs system image occasionally arrives as a corrupt ZIP
      # on hosted runners. Preinstall with bounded retries so a transient
      # SDK mirror failure does not masquerade as an app-test failure.
      - name: Preinstall Android emulator system image with retries
        shell: bash
        run: |
          set -euo pipefail
          package='system-images;android-35;google_apis;x86_64'
          for attempt in 1 2 3; do
            if sdkmanager --install "$package"; then
              exit 0
            fi
            echo "::warning::Android SDK image installation failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Android SDK image installation failed after 3 attempts"
          exit 1
      - name: Run Android device and UI instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Noma-emulator-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
